name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    uses: bitcart/bitcart-actions/.github/workflows/lint.yml@master
    with:
      install-dependencies: |
        uv sync --frozen --compile-bytecode --no-dev --group web --group types --group lint --group test
      extra-checks: just ci-lint

  workflows:
    name: workflows
    uses: bitcart/bitcart-actions/.github/workflows/workflow-checks.yml@master

    permissions:
      contents: read
      security-events: write # needed for github advanced security

  openapi:
    name: openapi
    needs: [lint, workflows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: bitcart/bitcart-actions/actions/setup-python@master

      - name: Install Python dependencies
        run: |
          uv sync --frozen --compile-bytecode --no-dev --group web --group otel

      - name: Dump OpenAPI schema
        run: just openapi

      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: openapi.json
          archive: false
          if-no-files-found: error

  test:
    name: test
    uses: bitcart/bitcart-actions/.github/workflows/python-tests.yml@master
    needs: [lint, workflows]
    with:
      python-versions: '["3.12", "3.13", "3.14"]'
      install-daemon: true
      install-dependencies: |
        uv sync --frozen --compile-bytecode --no-dev --group web --group otel --group test --group btc
      background: BTC_EXPERIMENTAL_NOSYNC=true just testnet
      tests: just test -n 4 --pytest-durations=-1
      redis: true
      postgres: true

    permissions:
      contents: read
      id-token: write # OIDC token for codecov uploads

  functional-tests:
    name: functional-tests
    uses: bitcart/bitcart-actions/.github/workflows/python-tests.yml@master
    needs: test
    with:
      install-daemon: true
      install-dependencies: |
        uv sync --frozen --compile-bytecode --no-dev --group web --group otel --group test --group btc
      regtest: true
      tests: just functional
      coverage-name: Functional Tests
      coverage-flag: functional-tests
      redis: true
      postgres: true

    permissions:
      contents: read
      id-token: write # OIDC token for codecov uploads

  combine-coverage:
    name: combine-coverage
    uses: bitcart/bitcart-actions/.github/workflows/combine-coverage.yml@master
    needs: [test, functional-tests]
    if: ${{ !cancelled() }}
