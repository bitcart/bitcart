name: Sync Labels

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  sync-labels:
    name: sync-labels
    uses: bitcart/bitcart-actions/.github/workflows/labels-sync.yml@master

    permissions:
      issues: write # to synchronize issue labels
